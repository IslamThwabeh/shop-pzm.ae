<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | PZM Computers & Phones Store</title>
    <meta name="description" content="The page you requested could not be found on PZM Computers & Phones Store." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8f5;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #dbe5dd;
        --accent: #18794e;
        --accent-dark: #0f5d3b;
        --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #eef7f1 0%, var(--bg) 48%, #ffffff 100%);
        color: var(--text);
      }

      .card {
        width: min(100%, 680px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 32px;
      }

      .eyebrow {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #edf8f1;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.65;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        color: var(--text);
        background: #fff;
        text-decoration: none;
        font-weight: 600;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .button.primary:hover {
        background: var(--accent-dark);
      }

      .help {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        color: var(--muted);
      }

      .help a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .help a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">404</span>
      <h1>Page not found</h1>
      <p>
        The page you requested is unavailable or may have been removed. If you were looking for a product,
        it may no longer be in the active catalog.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Go to homepage</a>
        <a class="button" href="/services/brand-new/">Browse products</a>
        <a class="button" href="https://wa.me/971528026677?text=Hi%2C%20I%27m%20looking%20for%20a%20product%20that%20may%20no%20longer%20be%20listed.%20Can%20you%20help%3F%20(via%20pzm.ae)" target="_blank" rel="noopener noreferrer">Ask on WhatsApp</a>
      </div>
      <div class="help">
        Need direct help? Call <a href="tel:+971528026677">+971 52 802 6677</a> or message the store team.
      </div>
    </main>
  </body>
</html>
