<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | PZM Computers & Phones</title>
    <meta name="description" content="The page you requested could not be found on PZM Computers & Phones." />
    <meta name="robots" content="noindex, follow" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16481610525"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag(){dataLayer.push(arguments)}
      gtag('js', new Date())
      gtag('config', 'AW-16481610525')
    </script>
    <script>
      (function () {
        var pathname = window.location.pathname || '/'
        var exactRoutes = ['/admin', '/cart', '/checkout', '/terms', '/return-policy', '/services', '/areas', '/blog', '/blog-post']
        var routePrefixes = ['/admin/', '/order/', '/product/', '/services/', '/areas/', '/blog/']
        var isKnownSpaRoute = exactRoutes.indexOf(pathname) !== -1 || routePrefixes.some(function (prefix) {
          return pathname.indexOf(prefix) === 0
        })

        if (!isKnownSpaRoute) {
          return
        }

        var targetPath = pathname + window.location.search + window.location.hash
        if (!targetPath || targetPath === '/') {
          return
        }

        window.location.replace('/?pzm-spa=' + encodeURIComponent(targetPath))
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8f5;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #dbe5dd;
        --accent: #18794e;
        --accent-dark: #0f5d3b;
        --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #eef7f1 0%, var(--bg) 48%, #ffffff 100%);
        color: var(--text);
      }

      .card {
        width: min(100%, 680px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 32px;
      }

      .eyebrow {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #edf8f1;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.65;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        color: var(--text);
        background: #fff;
        text-decoration: none;
        font-weight: 600;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .button.primary:hover {
        background: var(--accent-dark);
      }

      .help {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        color: var(--muted);
      }

      .help a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .help a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">404</span>
      <h1>Page not found</h1>
      <p>
        The page you requested is unavailable or may have been removed. If you were looking for a product,
        it may no longer be in the active catalog.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Go to homepage</a>
        <a class="button" href="/services/brand-new/">Browse products</a>
        <a id="not-found-whatsapp-link" class="button" href="https://wa.me/971528026677?text=Hi%2C%20I%27m%20looking%20for%20a%20product%20that%20may%20no%20longer%20be%20listed.%20Can%20you%20help%3F%20(via%20pzm.ae)" target="_blank" rel="noopener noreferrer">Ask on WhatsApp</a>
      </div>
      <div class="help">
        Need direct help? Call <a href="tel:+971528026677">+971 52 802 6677</a> or message the store team.
      </div>
    </main>
    <script>
      (function () {
        var whatsappLink = document.getElementById('not-found-whatsapp-link')
        if (!whatsappLink) {
          return
        }

        function getWhatsAppMessage(href) {
          try {
            var url = new URL(href, window.location.origin)
            return url.searchParams.get('text') || ''
          } catch (error) {
            return ''
          }
        }

        whatsappLink.addEventListener('click', function (event) {
          event.preventDefault()

          var href = whatsappLink.getAttribute('href') || ''
          var message = getWhatsAppMessage(href) || 'Hi, I need help finding a product that may no longer be listed. (via pzm.ae)'

          if (typeof window.gtag === 'function') {
            window.gtag('event', 'generate_lead', {
              method: 'whatsapp',
              lead_type: 'generic',
              reference_label: '404 page WhatsApp help',
              source_page: window.location.pathname,
            })
          }

          fetch('/api/whatsapp-leads', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              lead_type: 'service',
              reference_label: '404 page WhatsApp help',
              source_page: window.location.pathname,
              whatsapp_message: message,
            }),
            keepalive: true,
          }).catch(function () {
            return undefined
          })

          window.open(href, '_blank', 'noopener,noreferrer')
        })
      })()
    </script>
  </body>
</html>
